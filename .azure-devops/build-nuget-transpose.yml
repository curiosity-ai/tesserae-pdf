variables:
  buildConfiguration: 'Release'

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Tesserae.Pdf/*
      - .azure-devops/build-nuget-transpose.yml

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 sdk'
  inputs:
    packageType: sdk
    version: 10.x
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: NuGetToolInstaller@1

# Pinned to the release that matches the Transpose.BCL in the csproj files: the compiler and the
# runtime it calls into ship separately, and 26.10.x emits Transpose.fn.cacheBindMember, which BCL
# 26.9.4872 does not have - an unpinned install builds cleanly and ships a package whose viewers
# throw on mount. Bump it with the BCL, and in .github/workflows/pages.yml too.
- task: CmdLine@2
  displayName: 'install Transpose compiler'
  inputs:
    script: 'dotnet tool update --global Transpose.Compiler --version 26.9.4868'

- task: NodeTool@0
  displayName: 'Use Node.js 22.x'
  inputs:
    versionSpec: '22.x'

# The Transpose.Build.Target SDK runs the global `tps` tool installed above as part of the normal
# `dotnet build` below.

# Bundle pdf.js from its ESM build into the scripts the package ships (also runs as an MSBuild target
# during the build, but doing it explicitly here makes the produced artifact visible in the logs).
# pdf.js is not vendored in this repo - it is restored from the pinned npm package every build.
# `npm ci`, not `npm install`: the package that ships is built from exactly the tree in
# package-lock.json, the same one the Pages workflow builds the sample from.
- task: CmdLine@2
  displayName: 'bundle pdf.js'
  inputs:
    script: |
      npm ci --no-audit --no-fund
      npm run bundle
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Pdf/'

- task: CmdLine@2
  displayName: 'restore Tesserae.Pdf project'
  inputs:
    script: 'dotnet restore $(Build.SourcesDirectory)\Tesserae.Pdf\Tesserae.Pdf.csproj'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Pdf/'

- task: CmdLine@2
  displayName: 'Build Tesserae.Pdf'
  inputs:
    script: 'dotnet build $(Build.SourcesDirectory)\Tesserae.Pdf\Tesserae.Pdf.csproj -c $(buildConfiguration) /p:Version=$(targetVersion)'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Pdf/'

# The sample is not packed, but building it proves the package is consumable end to end - it is the
# only thing that exercises Tesserae.Pdf.targets copying pdf.js into an app's output.
- task: CmdLine@2
  displayName: 'Build Tesserae.Pdf.Sample'
  inputs:
    script: 'dotnet build $(Build.SourcesDirectory)\Tesserae.Pdf.Sample\Tesserae.Pdf.Sample.csproj -c $(buildConfiguration)'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Pdf.Sample/'

- task: CmdLine@2
  inputs:
    script: 'dir $(Build.SourcesDirectory)\Tesserae.Pdf\bin\ /S'

- task: NuGetCommand@2
  displayName: 'push Tesserae.Pdf to nuget'
  inputs:
    command: 'push'
    packagesToPush: '**/*/Tesserae.Pdf.$(targetVersion).nupkg' # The package name comes from the PackageID, not project name
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
